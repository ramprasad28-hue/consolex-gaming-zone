{% extends "base.html" %}
{% block title %}Password Reset Complete — {{ site.brand_name }}{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">

    <div class="auth-card-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>

    <h2>Password Reset Complete</h2>
    <p class="auth-sub">Your password has been set. You can now log in with your new password.</p>

    <div class="auth-footer">
      <a href="{% url 'users:login' %}" class="btn-primary btn-full" style="display:inline-block; width:auto; padding:0.75rem 2rem;">Log in</a>
    </div>

  </div>
</section>
{% endblock %}
