{% extends "base.html" %}
{% block title %}Page Not Found — {{ site.brand_name }}{% endblock %}

{% block content %}
<section class="error-section error-404">
    <div class="error-card">

        <div class="error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </div>

        <h1 class="error-code">404</h1>

        <p class="error-msg">This level doesn't exist.<br>The page you're looking for has been moved or doesn't exist.</p>

        <a href="/" class="error-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Home
        </a>

        <p class="error-hint">Or try <a href="/#games">Browse Games</a></p>

    </div>
</section>
{% endblock %}
