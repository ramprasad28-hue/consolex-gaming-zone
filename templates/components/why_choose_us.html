
<section class="wcu-section" id="why-us">

    <div class="wcu-bg">
        <div class="wcu-grid"></div>
        <div class="wcu-orb wcu-orb-1"></div>
        <div class="wcu-orb wcu-orb-2"></div>
    </div>

    <div class="wcu-container">

        <div class="wcu-head" data-reveal>
            <span class="wcu-tag">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/>
                </svg>
                {{ cb.features_pill }}
            </span>
            <h2 class="wcu-title">Built for <span class="wcu-neon">Real Gamers</span></h2>
            <p class="wcu-sub">Every detail of the lounge is tuned for one thing — zero friction between you and the game.</p>
        </div>

        <div class="wcu-grid-cards">
            {% for f in cms_why_choose %}
            <div class="wcu-card" data-reveal>
                <div class="wcu-icon">
                    {{ f.icon|safe }}
                </div>
                <h3 class="wcu-card-title">{{ f.title }}</h3>
                <p class="wcu-card-desc">{{ f.description }}</p>
            </div>
            {% endfor %}
        </div>

    </div>
</section>
