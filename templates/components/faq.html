<section class="faq-section" id="faq">
    <div class="faq-container">
        <div class="faq-header stagger-child">
            <span class="cx-badge cx-badge--primary">{{ cb.faq_pill }}</span>
            <h2 class="faq-title">{{ cb.faq_title }}</h2>
            <p class="faq-subtitle">{{ cb.faq_subtitle }}</p>
        </div>

        <div class="faq-filters stagger-child">
            <button class="faq-filter active" onclick="filterFaq('all', this)">All</button>
            {% for cat_val, cat_label in faq_categories %}
            <button class="faq-filter" onclick="filterFaq('{{ cat_label }}', this)">{{ cat_label }}</button>
            {% endfor %}
        </div>

        <div class="faq-list" id="faqList" role="list">
            {% for faq in cms_faqs %}
            <div class="faq-item stagger-child" data-faq="{{ forloop.counter }}" data-category="{{ faq.get_category_display }}" role="listitem">
                <button class="faq-question" onclick="toggleFaq({{ forloop.counter }})" aria-expanded="false" aria-controls="faq-answer-{{ forloop.counter }}">
                    <div class="faq-q-inner">
                        <span class="faq-cat-tag">{{ faq.get_category_display }}</span>
                        <span class="faq-q-text">{{ faq.question }}</span>
                    </div>
                    <div class="faq-chevron">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                </button>
                <div class="faq-answer" id="faq-answer-{{ forloop.counter }}" role="region">
                    <p>{{ faq.answer }}</p>
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="faq-cta stagger-child">
            <div class="faq-cta-box">
                <div class="faq-cta-text">
                    <p class="faq-cta-title">{{ cb.faq_cta_title }}</p>
                    <p class="faq-cta-sub">{{ cb.faq_cta_subtitle }}</p>
                </div>
                <a href="https://wa.me/{{ site.whatsapp_number }}" target="_blank" rel="noopener noreferrer" class="cx-btn cx-btn--primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                    {{ cb.faq_cta_btn }}
                </a>
            </div>
        </div>
    </div>
</section>

<script>
(function () {
    window.toggleFaq = function (id) {
        var item = document.querySelector('[data-faq="' + id + '"]');
        if (!item) return;
        var btn = item.querySelector('.faq-question');
        var wasOpen = item.classList.contains('faq-open');
        document.querySelectorAll('.faq-item').forEach(function (el) {
            el.classList.remove('faq-open');
            var b = el.querySelector('.faq-question');
            if (b) b.setAttribute('aria-expanded', 'false');
        });
        if (!wasOpen) {
            item.classList.add('faq-open');
            if (btn) btn.setAttribute('aria-expanded', 'true');
        }
    };

    window.filterFaq = function (cat, btn) {
        document.querySelectorAll('.faq-filter').forEach(function (b) {
            b.classList.remove('active');
        });
        btn.classList.add('active');
        document.querySelectorAll('.faq-item').forEach(function (item) {
            var show = cat === 'all' || item.dataset.category === cat;
            item.style.display = show ? '' : 'none';
        });
    };
}());
</script>
