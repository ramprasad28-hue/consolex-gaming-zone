<nav class="navbar" id="navbar">
    <div class="nav-inner">

        <!-- Logo -->
        <a href="/" class="nav-logo">
            <img src="/media/logo/favicon.png" alt="CONSOLEX" width="34" height="34" class="nav-logo-img">
            <div class="nav-logo-text">
                <span class="nav-logo-name">CONSOLEX</span>
                <span class="nav-logo-tag">PLAY BEYOND</span>
            </div>
        </a>

        <!-- Desktop Links — simplified to match reference -->
        <ul class="nav-links" id="navLinks">
            <li><a href="/" class="nl {% if request.path == '/' %}active{% endif %}">Home</a></li>
            <li><a href="{% url 'bookings:booking_form' %}" class="nl {% if request.path == '/book/' %}active{% endif %}">Booking</a></li>
            <li><a href="{% url 'memberships:plan_list' %}" class="nl {% if request.path == '/memberships/' %}active{% endif %}">Membership</a></li>
        </ul>

        <!-- Right actions -->
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            {% if user.is_authenticated %}
                <a href="{% url 'users:dashboard' %}" class="nav-user-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    </svg>
                    {{ user.username }}
                </a>
                <form method="POST" action="{% url 'users:logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="nav-logout" style="background:none;border:none;cursor:pointer;font:inherit;color:inherit;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'bookings:booking_form' %}" class="nav-book-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <rect x="3" y="4" width="18" height="18" rx="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8"  y1="2" x2="8"  y2="6"/>
                        <line x1="3"  y1="10" x2="21" y2="10"/>
                    </svg>
                    Book Now
                </a>
            {% endif %}
        </div>

        <!-- Hamburger -->
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span class="hb-line"></span>
            <span class="hb-line"></span>
            <span class="hb-line"></span>
        </button>

    </div>

    <!-- Mobile Drawer -->
    <div class="mob-drawer" id="mobDrawer">
        <ul class="mob-links">
            <li><a href="/" class="mob-link">Home</a></li>
            <li><a href="{% url 'bookings:booking_form' %}" class="mob-link">Booking</a></li>
            <li><a href="{% url 'memberships:plan_list' %}" class="mob-link">Membership</a></li>
        </ul>
        <div class="mob-auth">
            {% if user.is_authenticated %}
                <a href="{% url 'users:dashboard' %}" class="mob-dash-link">My Bookings</a>
                <form method="POST" action="{% url 'users:logout' %}" style="margin:0;">
                    {% csrf_token %}
                    <button type="submit" class="mob-logout-link" style="background:none;border:none;cursor:pointer;font:inherit;color:inherit;width:100%;text-align:left;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'bookings:booking_form' %}" class="mob-book-link">🎮 Book a Slot</a>
            {% endif %}
        </div>
    </div>
</nav>

<script>
(function () {
    var btn     = document.getElementById('hamburger');
    var drawer  = document.getElementById('mobDrawer');
    var navbar  = document.getElementById('navbar');
    var isOpen  = false;

    /* Theme toggle */
    var toggle  = document.getElementById('themeToggle');
    if (toggle) {
        toggle.addEventListener('click', function () {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });
    }

    window.addEventListener('scroll', function () {
        navbar.classList.toggle('nav-scrolled', window.scrollY > 50);
    }, { passive: true });

    btn.addEventListener('click', function () {
        isOpen = !isOpen;
        btn.classList.toggle('hb-open', isOpen);
        drawer.classList.toggle('drawer-open', isOpen);
        document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    drawer.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () {
            isOpen = false;
            btn.classList.remove('hb-open');
            drawer.classList.remove('drawer-open');
            document.body.style.overflow = '';
        });
    });

    document.querySelectorAll('a[href^="#"]').forEach(function (a) {
        a.addEventListener('click', function (e) {
            var id = a.getAttribute('href').slice(1);
            var el = document.getElementById(id);
            if (el) {
                e.preventDefault();
                window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 76, behavior: 'smooth' });
            }
        });
    });
}());
</script>
