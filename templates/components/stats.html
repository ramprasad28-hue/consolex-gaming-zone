<section class="gaming-stats" aria-label="Gaming Statistics">
    <div class="stats-container">
        <div class="stats-grid">
            <div class="stat-item stagger-child">
                <span class="stat-number stat-counter" data-count-to="5000" data-suffix="+">0</span>
                <span class="stat-label">Players Served</span>
            </div>
            <div class="stat-item stagger-child">
                <span class="stat-number stat-counter" data-count-to="15000" data-suffix="+">0</span>
                <span class="stat-label">Hours Played</span>
            </div>
            <div class="stat-item stagger-child">
                <span class="stat-number stat-counter" data-count-to="2000" data-suffix="+">0</span>
                <span class="stat-label">Bookings Completed</span>
            </div>
            <div class="stat-item stagger-child">
                <span class="stat-number stat-counter" data-count-to="200" data-suffix="+">0</span>
                <span class="stat-label">Active Members</span>
            </div>
            <div class="stat-item stagger-child">
                <span class="stat-number stat-counter" data-count-to="50" data-suffix="+">0</span>
                <span class="stat-label">Tournaments Hosted</span>
            </div>
        </div>
    </div>
</section>
