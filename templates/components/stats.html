<section class="gaming-stats" aria-label="Gaming Statistics">
    <div class="stats-container">
        <div class="stats-grid">
            {% for s in cms_stats %}
            <div class="stat-item stagger-child">
                <span class="stat-number stat-counter" data-count-to="{{ s.number }}" data-suffix="{{ s.suffix }}">0</span>
                <span class="stat-label">{{ s.label }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
