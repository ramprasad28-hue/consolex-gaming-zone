{% if cms_announcement and cms_announcement.is_active %}
<div class="announcement-bar" role="banner" aria-label="Announcement">
    <div class="announcement-inner">
        <span class="announcement-icon">{{ cms_announcement.icon }}</span>
        <p class="announcement-text">
            {{ cms_announcement.text }}
            <a href="{{ cms_announcement.cta_url }}" class="announcement-link">{{ cms_announcement.cta_text }}</a>
        </p>
    </div>
</div>
{% endif %}
