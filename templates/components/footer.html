<footer class="site-footer" id="contact">

    <!-- Background glow -->
    <div class="footer-glow"></div>

    <div class="footer-container">

        <!-- Main row -->
        <div class="footer-main">

            <!-- Brand column -->
            <div class="footer-brand">
                <a href="/" class="footer-logo">
                    <img src="/media/logo/favicon.png" alt="{{ site.brand_name }}" width="32" height="32" class="footer-logo-img">
                    <span class="footer-brand-name">{{ site.brand_name }}</span>
                </a>
                <p class="footer-tagline">{{ cb.footer_tagline }}</p>
                <div class="footer-open-badge">
                    <span class="footer-open-dot"></span>
                    Open Now — {{ site.operating_hours }}
                </div>
            </div>

            <!-- Links columns -->
            <div class="footer-links-group">

                <div class="footer-links-col">
                    <a href="/" class="footer-link">Home</a>
                    <a href="{% url 'bookings:booking_form' %}" class="footer-link">Book a Session</a>
                    <a href="{% url 'memberships:plan_list' %}" class="footer-link">Memberships</a>
                </div>

                <div class="footer-links-col">
                    <div class="footer-contact-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        <span>{{ site.address }}</span>
                    </div>
                    <div class="footer-contact-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 014.07 9.8 19.79 19.79 0 011 1.18 2 2 0 013 .82h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 8.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                        <a href="tel:{{ site.phone }}">{{ site.phone }}</a>
                    </div>
                    <div class="footer-contact-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span>{{ site.operating_hours }}</span>
                    </div>
                </div>

            </div>

        </div>

        <!-- Bottom bar -->
        <div class="footer-bottom">
            <p class="footer-copy">{{ cb.footer_copyright }}</p>
            <div class="footer-socials">
                <a href="{{ site.instagram_url }}" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="footer-social-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
                </a>
                <a href="https://wa.me/{{ site.whatsapp_number }}" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" class="footer-social-icon footer-social-icon-green">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
                </a>
                <span class="footer-dot">&middot;</span>
                <a href="/" class="footer-bottom-link">Privacy</a>
                <a href="/" class="footer-bottom-link">Terms</a>
            </div>
        </div>

    </div>
</footer>
