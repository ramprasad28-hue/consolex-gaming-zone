{% extends "base.html" %}
{% block title %}Server Error — {{ site.brand_name }}{% endblock %}

{% block content %}
<section class="error-section error-500">
    <div class="error-card">

        <div class="error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>

        <h1 class="error-code">500</h1>

        <p class="error-msg">System Error — our server hit a glitch.<br>Our team has been notified. Please try again shortly.</p>

        <a href="/" class="error-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Reload Home
        </a>

    </div>
</section>
{% endblock %}
